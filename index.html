    /**
     * =====================================================================
     * 5. SISTEM NOTIFIKASI TOAST & MODAL KONFIRMASI (ANTI ALERT/CONFIRM)
     * =====================================================================
     */
    function showToast(message, type = 'success') {
      const existing = document.getElementById('lms-toast');
      if (existing) existing.remove();

      const colors = {
        success: 'bg-slate-900 text-white border-slate-700',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-[#5B45E0] text-white border-indigo-400'
      };

      const toast = document.createElement('div');
      toast.id = 'lms-toast';
      toast.className = `fixed top-5 right-5 z-[1000005] flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium transition-all duration-300 transform translate-y-0 ${colors[type] || colors.success}`;
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
        <span>${escapeHtml(message)}</span>
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function openConfirmDialog(title, message, onConfirm) {
      state.confirmModal = { title, message, onConfirm };
      renderApp();
    }

    function closeConfirmDialog() {
      state.confirmModal = null;
      renderApp();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /**
     * =====================================================================
     * 6. SINKRONISASI DATA (PREVIEW LOKAL vs SUPABASE PRODUCTION)
     * =====================================================================
     */
    async function loadAllData() {
      state.loading = true;
      renderApp();

      try {
        if (IS_PREVIEW) {
          // Gunakan salinan memori lokal saat Mode Preview aktif
          state.data.siswa = [...PREVIEW_STORE.siswa];
          state.data.courses = [...PREVIEW_STORE.courses];
          state.data.kuis_soal = [...PREVIEW_STORE.kuis_soal];
          state.data.progres_nilai = [...PREVIEW_STORE.progres_nilai];
          state.data.tools_pustaka = [...PREVIEW_STORE.tools_pustaka];
          state.data.jadwal_live = [...PREVIEW_STORE.jadwal_live];
        } else {
          // 100% Query Real-Time ke Supabase saat Produksi
          const [
            resSiswa,
            resCourses,
            resKuis,
            resProgres,
            resPustaka,
            resJadwal
          ] = await Promise.all([
            supabase.from('siswa').select('*').order('created_at', { ascending: false }),
            supabase.from('courses').select('*').order('created_at', { ascending: false }),
            supabase.from('kuis_soal').select('*'),
            supabase.from('progres_nilai').select('*'),
            supabase.from('tools_pustaka').select('*').order('created_at', { ascending: false }),
            supabase.from('jadwal_live').select('*').order('tanggal', { ascending: true })
          ]);

          if (resSiswa.error) throw resSiswa.error;
          if (resCourses.error) throw resCourses.error;

          state.data.siswa = resSiswa.data || [];
          state.data.courses = resCourses.data || [];
          state.data.kuis_soal = resKuis.data || [];
          state.data.progres_nilai = resProgres.data || [];
          state.data.tools_pustaka = resPustaka.data || [];
          state.data.jadwal_live = resJadwal.data || [];

          // Perbarui data profil siswa aktif jika role adalah siswa
          if (state.role === 'siswa' && state.user) {
            const freshSiswa = state.data.siswa.find(s => s.id === state.user.id);
            if (freshSiswa) {
              state.user = freshSiswa;
              localStorage.setItem('smp_lms_siswa_session', JSON.stringify(freshSiswa));
            }
          }
        }
      } catch (err) {
        console.error('Error memuat data:', err);
        showToast('Gagal memuat data dari server: ' + (err.message || 'Periksa koneksi'), 'error');
      } finally {
        state.loading = false;
        renderApp();
      }
    }

    /**
     * =====================================================================
     * 7. HYBRID AUTHENTICATION (ADMIN VIA SUPABASE AUTH, SISWA VIA TABEL)
     * =====================================================================
     */
    async function checkInitialSession() {
      if (IS_PREVIEW) {
        renderApp();
        return;
      }

      try {
        // 1. Cek Session Admin Supabase Auth
        const { data: { session } } = await supabase.auth.getSession();
        if (session && session.user) {
          state.isAuthenticated = true;
          state.role = 'admin';
          state.user = {
            id: session.user.id,
            email: session.user.email,
            nama_lengkap: session.user.email.split('@')[0],
            jabatan: 'Guru / Administrator'
          };
          await loadAllData();
          return;
        }

        // 2. Cek Session Siswa tersimpan di localStorage & validasi ke tabel siswa
        const savedSiswa = localStorage.getItem('smp_lms_siswa_session');
        if (savedSiswa) {
          const parsed = JSON.parse(savedSiswa);
          const { data, error } = await supabase
            .from('siswa')
            .select('*')
            .eq('id', parsed.id)
            .single();

          if (data && !error) {
            state.isAuthenticated = true;
            state.role = 'siswa';
            state.user = data;
            await loadAllData();
            return;
          } else {
            localStorage.removeItem('smp_lms_siswa_session');
          }
        }
      } catch (e) {
        console.error('Session check error:', e);
      }

      renderApp();
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const form = e.target;

      if (state.loginTab === 'siswa') {
        const nisn = form.nisn.value.trim();
        const password = form.password.value.trim();

        if (!nisn || !password) {
          showToast('Masukkan NISN/Username dan Password siswa.', 'error');
          return;
        }

        state.loading = true;
        renderApp();

        try {
          if (IS_PREVIEW) {
            const found = PREVIEW_STORE.siswa.find(
              s => s.nisn === nisn && s.password === password
            );
            if (!found) throw new Error('NISN atau Password tidak cocok (Mode Preview).');
            state.isAuthenticated = true;
            state.role = 'siswa';
            state.user = { ...found };
            state.activeMenu = 'dashboard';
            await loadAllData();
            showToast(`Selamat datang kembali, ${found.nama_lengkap}!`);
          } else {
            const { data, error } = await supabase
              .from('siswa')
              .select('*')
              .eq('nisn', nisn)
              .eq('password', password)
              .maybeSingle();

            if (error) throw error;
            if (!data) throw new Error('NISN atau Password siswa tidak ditemukan.');

            state.isAuthenticated = true;
            state.role = 'siswa';
            state.user = data;
            state.activeMenu = 'dashboard';
            localStorage.setItem('smp_lms_siswa_session', JSON.stringify(data));
            await loadAllData();
            showToast(`Berhasil masuk sebagai ${data.nama_lengkap}`);
          }
        } catch (err) {
          state.loading = false;
          renderApp();
          showToast(err.message || 'Gagal masuk sebagai siswa.', 'error');
        }
      } else {
        // Login Admin / Guru via Supabase Auth
        const email = form.email.value.trim();
        const password = form.password.value.trim();

        if (!email || !password) {
          showToast('Masukkan Email dan Password Guru/Admin.', 'error');
          return;
        }

        state.loading = true;
        renderApp();

        try {
          if (IS_PREVIEW) {
            state.isAuthenticated = true;
            state.role = 'admin';
            state.user = {
              id: 'admin-preview',
              email: email,
              nama_lengkap: 'Budi Santoso, S.Pd.',
              jabatan: 'Guru & Admin LMS'
            };
            state.activeMenu = 'dashboard';
            await loadAllData();
            showToast('Berhasil masuk sebagai Guru / Admin (Preview).');
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({
              email,

    async function markCourseCompleted(courseId, quizScore = null) {
      if (state.role !== 'siswa' || !state.user) {
        showToast('Mode Guru: Pratinjau materi berhasil ditampilkan.', 'info');
        return;
      }

      try {
        const existing = state.data.progres_nilai.find(
          p => p.siswa_id === state.user.id && p.course_id === courseId
        );
        const finalScore = quizScore !== null ? quizScore : (existing?.skor_kuis || 0);
        const isFirstCompletion = !existing || !existing.status_selesai;

        if (IS_PREVIEW) {
          if (existing) {
            existing.status_selesai = true;
            if (quizScore !== null) existing.skor_kuis = quizScore;
          } else {
            PREVIEW_STORE.progres_nilai.push({
              id: 'p-' + Date.now(),
              siswa_id: state.user.id,
              course_id: courseId,
              status_selesai: true,
              skor_kuis: finalScore
            });
          }

          if (isFirstCompletion) {
            const sObj = PREVIEW_STORE.siswa.find(s => s.id === state.user.id);
            if (sObj) sObj.poin = (sObj.poin || 0) + 50;
            state.user.poin = (state.user.poin || 0) + 50;
            showToast('Selamat! Materi selesai & Anda mendapatkan +50 EduPoints!');
          } else {
            showToast('Progres & nilai kuis berhasil diperbarui!');
          }
          await loadAllData();
        } else {
          // Upsert ke tabel progres_nilai Supabase
          if (existing) {
            const { error } = await supabase
              .from('progres_nilai')
              .update({
                status_selesai: true,
                skor_kuis: finalScore,
                updated_at: new Date().toISOString()
              })
              .eq('id', existing.id);
            if (error) throw error;
          } else {
            const { error } = await supabase
              .from('progres_nilai')
              .insert([{
                siswa_id: state.user.id,
                course_id: courseId,
                status_selesai: true,
                skor_kuis: finalScore
              }]);
            if (error) throw error;
          }

          if (isFirstCompletion) {
            const newPoin = (state.user.poin || 0) + 50;
            await supabase
              .from('siswa')
              .update({ poin: newPoin })
              .eq('id', state.user.id);
            showToast('Hebat! Materi selesai (+50 EduPoints).');
          } else {
            showToast('Nilai kuis tersimpan ke database.');
          }
          await loadAllData();
        }
      } catch (err) {
        showToast('Gagal menyimpan progres: ' + err.message, 'error');
      }
    }

    async function submitCbtQuiz() {
      if (!state.activeCourseModal) return;
      const questions = state.data.kuis_soal.filter(
        q => q.course_id === state.activeCourseModal.id
      );
      if (questions.length === 0) return;

      let correct = 0;
      questions.forEach(q => {
        if (state.quizAnswers[q.id] === q.kunci_jawaban) {
          correct++;
        }
      });

      const score = Math.round((correct / questions.length) * 100);
      state.quizSubmitted = true;
      state.quizScore = score;
      renderApp();

      if (state.role === 'siswa') {
        await markCourseCompleted(state.activeCourseModal.id, score);
      }
    }

    async function redeemReward(rewardName, cost) {
      if (state.role !== 'siswa' || !state.user) {
        showToast('Fitur penukaran poin khusus untuk akun Siswa.', 'info');
        return;
      }
      const currentPoin = state.user.poin || 0;
      if (currentPoin < cost) {
        showToast(`EduPoints belum cukup. Butuh ${cost} poin.`, 'error');
        return;
      }

      openConfirmDialog(
        'Tukar EduPoints?',
        `Gunakan ${cost} EduPoints untuk mengklaim "${rewardName}"?`,
        async () => {
          closeConfirmDialog();
          const sisa = currentPoin - cost;
          try {
            if (IS_PREVIEW) {
              const sObj = PREVIEW_STORE.siswa.find(s => s.id === state.user.id);
              if (sObj) sObj.poin = sisa;
              state.user.poin = sisa;
              await loadAllData();
              showToast(`Berhasil menukar "${rewardName}"!`);
            } else {
              const { error } = await supabase
                .from('siswa')
                .update({ poin: sisa })
                .eq('id', state.user.id);
              if (error) throw error;
              await loadAllData();
              showToast(`Berhasil mengklaim "${rewardName}"!`);
            }
          } catch (err) {
            showToast('Gagal menukar poin: ' + err.message, 'error');
          }
        }
      );
    }

    function changeCalendarMonth(delta) {

    function renderCalendarWidget() {
      const year = state.calendarDate.getFullYear();
      const month = state.calendarDate.getMonth();
      const monthNames = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      // Kumpulkan tanggal yang memiliki jadwal live di bulan ini
      const eventDays = new Set();
      state.data.jadwal_live.forEach(j => {
        if (j.tanggal) {
          const dt = new Date(j.tanggal);
          if (dt.getFullYear() === year && dt.getMonth() === month) {
            eventDays.add(dt.getDate());
          }
        }
      });

      let cellsHtml = '';
      // Tanggal bulan sebelumnya (redup)
      for (let i = firstDay - 1; i >= 0; i--) {
        cellsHtml += `<div class="h-8 flex items-center justify-center text-xs text-slate-300 font-medium">${prevMonthDays - i}</div>`;
      }

      // Tanggal bulan berjalan
      for (let day = 1; day <= daysInMonth; day++) {
        const isSelected = day === state.selectedDay;
        const hasEvent = eventDays.has(day);
        if (isSelected) {
          cellsHtml += `
            <button onclick="window.lmsActions.selectDay(${day})" class="h-8 w-8 mx-auto rounded-full bg-[#5B45E0] text-white text-xs font-bold flex items-center justify-center shadow-sm transition">
              ${day}
            </button>
          `;
        } else {
          cellsHtml += `
            <button onclick="window.lmsActions.selectDay(${day})" class="relative h-8 w-8 mx-auto rounded-full hover:bg-slate-100 text-slate-700 text-xs font-semibold flex items-center justify-center transition">
              ${day}
              ${hasEvent ? '<span class="absolute bottom-1 w-1 h-1 rounded-full bg-[#5B45E0]"></span>' : ''}
            </button>
          `;
        }
      }

      return `
        <div class="bg-white rounded-2xl border border-slate-100 p-4 shadow-soft">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2 text-sm font-bold text-slate-800">
              <i data-lucide="calendar" class="w-4 h-4 text-[#5B45E0]"></i>
              <span>${monthNames[month]} ${year}</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="window.lmsActions.changeMonth(-1)" class="p-1 rounded-lg hover:bg-slate-100 text-slate-500" title="Bulan Sebelumnya">
                <i data-lucide="chevron-up" class="w-4 h-4"></i>
              </button>
              <button onclick="window.lmsActions.changeMonth(1)" class="p-1 rounded-lg hover:bg-slate-100 text-slate-500" title="Bulan Berikutnya">
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="grid grid-cols-7 text-center text-[11px] font-semibold text-slate-400 mb-2">
            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
          </div>
          <div class="grid grid-cols-7 gap-y-1 text-center">
            ${cellsHtml}
          </div>
        </div>
      `;
    }

    function renderCourseRow(course) {

              <div class="grid grid-cols-3 gap-2 mt-4">

                  <div class="text-base font-extrabold text-[#5B45E0] mt-0.5">${reamur} °R</div>

                <div class="p-3 rounded-2xl bg-[#FFF7ED] text-center">
                  <div class="text-[11px] font-semibold text-slate-500">Fahrenheit</div>
                  <div class="text-base font-extrabold text-orange-600 mt-0.5">${fahrenheit} °F</div>

            ${tools.length === 0 ? `

                      <span class="px-2.5 py-0.5 rounded-full bg-orange-100 text-orange-700 text-[10px] font-bold">${escapeHtml(t.kategori)}</span>

    /**

     * 14. MODAL PEMUTAR MATERI & KUIS CBT INTERAKTIF

     */
    function renderCourseModal() {
      const course = state.activeCourseModal;
      if (!course) return '';

      const questions = state.data.kuis_soal.filter(q => q.course_id === course.id);
      const isDone = state.role === 'siswa' && state.data.progres_nilai.some(
        p => p.siswa_id === state.user?.id && p.course_id === course.id && p.status_selesai
      );

      return `
        <div class="fixed inset-0 z-[1000001] bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6">
          <div class="bg-white w-full max-w-3xl max-h-[90vh] rounded-3xl shadow-2xl border border-slate-100 flex flex-col overflow-hidden">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
              <div>
                <span class="px-2.5 py-0.5 rounded-full bg-[#EEF0FF] text-[#5B45E0] text-[11px] font-bold">
                  ${escapeHtml(course.mapel)} • ${escapeHtml(course.jenjang)}
                </span>
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900 mt-1">${escapeHtml(course.judul)}</h3>
              </div>
              <button onclick="window.lmsActions.closeCourse()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center shrink-0">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <!-- Tabs Materi vs Kuis CBT -->
            <div class="px-6 pt-3 border-b border-slate-100 flex items-center gap-4 bg-slate-50/60">
              <button
                onclick="window.lmsActions.setCourseTab('materi')"
                class="pb-3 text-xs sm:text-sm font-bold border-b-2 transition ${state.courseModalTab === 'materi' ? 'border-[#5B45E0] text-[#5B45E0]' : 'border-transparent text-slate-500'}"
              >
                1. Modul Pembelajaran
              </button>
              <button
                onclick="window.lmsActions.setCourseTab('kuis')"
                class="pb-3 text-xs sm:text-sm font-bold border-b-2 transition flex items-center gap-1.5 ${state.courseModalTab === 'kuis' ? 'border-[#5B45E0] text-[#5B45E0]' : 'border-transparent text-slate-500'}"
              >
                <span>2. Latihan Kuis CBT</span>
                <span class="px-2 py-0.5 rounded-full bg-indigo-100 text-[#5B45E0] text-[10px]">${questions.length}</span>
              </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 overflow-y-auto custom-scroll flex-1 space-y-5">
              ${state.courseModalTab === 'materi' ? `
                <div class="flex items-center justify-between text-xs text-slate-500 bg-slate-50 p-3 rounded-2xl">
                  <span>Pengampu: <strong class="text-slate-800">${escapeHtml(course.guru_pengampu || 'Guru Mapel')}</strong></span>
                  <span>Estimasi Belajar: <strong class="text-slate-800">${escapeHtml(course.durasi)}</strong></span>
                </div>

                ${course.video_url ? `
                  <div class="aspect-video rounded-2xl overflow-hidden bg-slate-900 border border-slate-200">
                    <iframe src="${escapeHtml(course.video_url)}" class="w-full h-full" allowfullscreen></iframe>
                  </div>
                ` : ''}

                <div class="prose prose-sm max-w-none text-slate-700 leading-relaxed whitespace-pre-line text-sm bg-white p-4 rounded-2xl border border-slate-100">
                  ${escapeHtml(course.konten_materi)}
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                  <button
                    onclick="window.lmsActions.completeCourse('${course.id}')"
                    class="px-5 py-3 rounded-xl ${isDone ? 'bg-emerald-600 text-white' : 'bg-[#5B45E0] hover:bg-[#4328D9] text-white'} text-xs font-bold flex items-center gap-2 transition"
                  >
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                    <span>${isDone ? 'Materi Sudah Selesai (+50 Poin Diterima)' : 'Tandai Selesai & Klaim +50 EduPoints'}</span>
                  </button>
                  ${questions.length > 0 ? `
                    <button
                      onclick="window.lmsActions.setCourseTab('kuis')"
                      class="px-4 py-3 rounded-xl bg-[#EEF0FF] text-[#5B45E0] text-xs font-bold hover:bg-indigo-100 transition"
                    >
                      Lanjut Kerjakan Kuis →
                    </button>
                  ` : ''}
                </div>
              ` : `
                ${questions.length === 0 ? `
                  <div class="text-center py-10">
                    <p class="text-sm font-bold text-slate-700">Belum ada soal kuis untuk bab ini</p>
                    <p class="text-xs text-slate-400 mt-1">Silakan selesaikan bacaan modul terlebih dahulu.</p>
                  </div>
                ` : `
                  ${state.quizSubmitted ? `
                    <div class="p-5 rounded-2xl bg-[#F5F3FF] border border-indigo-200 text-center">
                      <div class="text-xs font-bold text-[#5B45E0] uppercase">Hasil Evaluasi CBT</div>
                      <div class="text-4xl font-extrabold text-slate-900 mt-1">${state.quizScore} <span class="text-base font-bold text-slate-400">/ 100</span></div>
                      <p class="text-xs text-slate-600 mt-1">Skor telah direkam otomatis ke laporan belajar Anda.</p>
                    </div>
                  ` : ''}

                  <div class="space-y-4">
                    ${questions.map((q, idx) => `
                      <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200/70 space-y-3">
                        <p class="text-sm font-bold text-slate-900">${idx + 1}. ${escapeHtml(q.pertanyaan)}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          ${['A','B','C','D'].map(opt => {
                            const val = q['opsi_' + opt.toLowerCase()];
                            const picked = state.quizAnswers[q.id] === opt;
                            let btnStyle = picked
                              ? 'bg-[#5B45E0] text-white border-[#5B45E0]'
                              : 'bg-white text-slate-700 border-slate-200 hover:border-[#5B45E0]';

                            if (state.quizSubmitted) {
                              if (opt === q.kunci_jawaban) {
                                btnStyle = 'bg-emerald-600 text-white border-emerald-600';
                              } else if (picked && opt !== q.kunci_jawaban) {
                                btnStyle = 'bg-rose-600 text-white border-rose-600';
                              }
                            }

                            return `
                              <button
                                type="button"
                                ${state.quizSubmitted ? 'disabled' : ''}
                                onclick="window.lmsActions.pickAnswer('${q.id}', '${opt}')"
                                class="text-left p-3 rounded-xl border text-xs font-semibold transition flex items-center gap-2.5 ${btnStyle}"
                              >
                                <span class="w-6 h-6 rounded-lg bg-black/10 flex items-center justify-center font-bold shrink-0">${opt}</span>
                                <span>${escapeHtml(val)}</span>
                              </button>
                            `;
                          }).join('')}
                        </div>
                        ${state.quizSubmitted && q.pembahasan ? `
                          <div class="p-3 rounded-xl bg-emerald-50 text-emerald-800 text-xs">
                            <strong>Pembahasan:</strong> ${escapeHtml(q.pembahasan)}
                          </div>
                        ` : ''}
                      </div>
                    `).join('')}
                  </div>

                  ${!state.quizSubmitted ? `
                    <button
                      type="button"
                      onclick="window.lmsActions.submitQuiz()"
                      class="w-full py-3.5 rounded-xl bg-[#5B45E0] hover:bg-[#4328D9] text-white text-sm font-bold shadow-lg shadow-indigo-500/20 transition"
                    >
                      Kumpulkan Jawaban & Lihat Nilai
                    </button>
                  ` : ''}
                `}
              `}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * =====================================================================
     * 15. MODAL KONFIRMASI KUSTOM (PENGGANTI confirm() BROWSER)
     * =====================================================================
     */
    function renderConfirmModal() {
      if (!state.confirmModal) return '';
      return `
        <div class="fixed inset-0 z-[1000003] bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 text-center">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-[#5B45E0] flex items-center justify-center mx-auto mb-3">
              <i data-lucide="alert-circle" class="w-6 h-6"></i>
            </div>
            <h4 class="text-base font-extrabold text-slate-900">${escapeHtml(state.confirmModal.title)}</h4>
            <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${escapeHtml(state.confirmModal.message)}</p>
            <div class="grid grid-cols-2 gap-2.5 mt-5">
              <button onclick="window.lmsActions.closeConfirm()" class="py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                Batal
              </button>
              <button onclick="window.lmsActions.executeConfirm()" class="py-2.5 rounded-xl bg-[#5B45E0] hover:bg-[#4328D9] text-white text-xs font-bold transition">
                Ya, Lanjutkan
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * =====================================================================
     * 16. RENDER UTAMA SHELL DASHBOARD (PERSIS REFERENSI GAMBAR)
     * =====================================================================
     */
    function renderDashboardShell() {
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'home' },
        { id: 'courses', label: 'Courses', icon: 'book-open' },
        { id: 'tools', label: 'Tools', icon: 'wrench' },
        { id: 'template', label: 'Template', icon: 'archive' },
        { id: 'market', label: 'Market', icon: 'store' },
        { id: 'schedule', label: 'Schedule', icon: 'video' },
        { id: 'help', label: 'Help / FAQ', icon: 'help-circle' }
      ];

      if (state.role === 'admin') {
        navItems.push({ id: 'admin_panel', label: 'Kelola LMS', icon: 'settings' });
      }

      const pageTitles = {
        dashboard: 'Dashboard',
        courses: 'Courses & Mapel SMP',
        tools: 'Tools & Lab Virtual',
        template: 'Template & LKPD',
        market: 'Market EduPoints',
        schedule: 'Schedule & Live Class',
        help: 'Help / FAQ',
        admin_panel: 'Panel Manajemen Guru'
      };

      const highlightLive = state.data.jadwal_live.find(j => j.is_highlight) || state.data.jadwal_live[0];
      const userName = state.user?.nama_lengkap || 'Peserta SMP';
      const userSub = state.role === 'admin'
        ? (state.user?.jabatan || 'Guru / Admin')
        : `${state.user?.kelas || 'Siswa SMP'} • ${state.user?.poin || 0} Poin`;

      let activeContent = '';
      switch (state.activeMenu) {
        case 'dashboard': activeContent = renderDashboardPage(); break;
        case 'courses': activeContent = renderCoursesPage(); break;
        case 'tools': activeContent = renderToolsPage(); break;
        case 'template': activeContent = renderTemplatePage(); break;
        case 'market': activeContent = renderMarketPage(); break;
        case 'schedule': activeContent = renderSchedulePage(); break;
        case 'help': activeContent = renderHelpPage(); break;
        case 'admin_panel': activeContent = renderAdminPanelPage(); break;
        default: activeContent = renderDashboardPage();
      }

      return `
        <div class="w-full h-full flex overflow-hidden bg-[#F7F8FC]">
          <!-- ===============================================================
               KOLOM 1: LEFT SIDEBAR (DESKTOP)
               =============================================================== -->
          <aside class="desktop-sidebar w-[245px] shrink-0 bg-white border-r border-slate-100 flex-col justify-between p-5 overflow-y-auto custom-scroll">
            <div>
              <!-- Brand Logo -->
              <div class="flex items-center gap-3 px-2 mb-7">
                <div class="w-10 h-10 rounded-xl bg-[#5B45E0] text-white flex items-center justify-center shadow-md shadow-indigo-500/20">
                  <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                </div>
                <div>
                  <span class="text-lg font-extrabold text-slate-900 tracking-tight block leading-none">EDUNOVA</span>
                  <span class="text-[10px] font-bold text-[#5B45E0] tracking-wider uppercase">Portal LMS</span>
                </div>
              </div>

              <!-- Menu Navigasi Utama -->
              <nav class="space-y-1.5">
                ${navItems.map(item => {
                  const active = state.activeMenu === item.id;
                  return `
                    <button
                      onclick="window.lmsActions.setMenu('${item.id}')"
                      class="w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-[13.5px] transition ${active ? 'bg-[#EEF0FF] text-[#5B45E0] font-bold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800 font-medium'}"
                    >
                      <i data-lucide="${item.icon}" class="w-[18px] h-[18px] ${active ? 'text-[#5B45E0]' : 'text-slate-400'}"></i>
                      <span>${item.label}</span>
                    </button>
                  `;
                }).join('')}
              </nav>
            </div>

            <!-- Promo / Highlight Card Bawah Sidebar (Sesuai Referensi Gambar) -->
            <div class="mt-6 pt-4">
              <div class="relative bg-[#F5F3FF] border border-indigo-100 rounded-2xl p-4 text-center pt-7">
                <div class="w-10 h-10 rounded-xl bg-white shadow-sm border border-indigo-100 text-[#5B45E0] flex items-center justify-center mx-auto absolute -top-5 left-1/2 -translate-x-1/2">
                  <i data-lucide="laptop" class="w-5 h-5"></i>
                </div>
                <h4 class="text-xs font-extrabold text-slate-900">SMP Smart LMS V2</h4>
                <p class="text-[11px] text-slate-500 mt-1 leading-relaxed">
                  Akselerasi prestasi akademik & literasi digital siswa SMP
                </p>
                <button
                  onclick="window.lmsActions.setMenu('courses')"
                  class="w-full mt-3.5 py-2.5 rounded-xl bg-[#5B45E0] hover:bg-[#4328D9] text-white text-xs font-bold shadow-sm transition"
                >
                  Pelajari Modul
                </button>
              </div>
            </div>
          </aside>

          <!-- ===============================================================
               KOLOM 2: CENTER WORKSPACE
               =============================================================== -->
          <main class="flex-1 h-full overflow-y-auto custom-scroll main-scroll-area px-4 sm:px-7 py-5">
            ${IS_PREVIEW ? `
              <div class="mb-4 px-3.5 py-2 rounded-2xl bg-amber-50 border border-amber-200/80 text-amber-800 text-xs font-semibold flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  <span><strong>Mode Preview Aktif:</strong> Menggunakan data uji lokal. Ubah <code class="bg-amber-100 px-1 rounded">IS_PREVIEW = false</code> untuk koneksi Supabase live.</span>
                </div>
              </div>
            ` : ''}

            <!-- Top Header Bar -->
            <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
              <div class="flex items-center gap-3">
                <div class="lg:hidden w-9 h-9 rounded-xl bg-[#5B45E0] text-white flex items-center justify-center">
                  <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">
                  ${pageTitles[state.activeMenu] || 'Dashboard'}
                </h1>
              </div>

              <div class="flex items-center gap-2.5 flex-1 sm:flex-initial justify-end">
                <!-- Capsule Search Bar -->
                <div class="relative flex-1 sm:w-64 max-w-xs">
                  <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                  <input
                    type="text"
                    value="${escapeHtml(state.searchQuery)}"
                    oninput="window.lmsActions.search(this.value)"
                    placeholder="Search courses, tools..."
                    class="w-full pl-9 pr-4 py-2 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-[#5B45E0] transition"
                  />
                </div>

                <!-- Role Pill Badge -->
                <button
                  onclick="window.lmsActions.toggleMobileUtility()"
                  class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-[#EEF0FF] text-[#5B45E0] text-xs font-bold"
                >
                  <i data-lucide="user" class="w-3.5 h-3.5"></i>
                  <span>${state.role === 'admin' ? 'Guru/Admin' : (state.user?.kelas || 'Peserta')}</span>
                </button>

                <!-- Logout Icon Button -->
                <button
                  onclick="window.lmsActions.logout()"
                  title="Keluar"
                  class="w-9 h-9 rounded-xl bg-white hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-200 flex items-center justify-center transition shrink-0"
                >
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
              </div>
            </header>

            <!-- Konten Dinamis -->
            ${state.loading ? `
              <div class="py-20 flex flex-col items-center justify-center text-slate-400">
                <div class="w-8 h-8 border-4 border-[#5B45E0] border-t-transparent rounded-full animate-spin mb-3"></div>
                <span class="text-xs font-semibold">Menyelaraskan data pembelajaran...</span>
              </div>
            ` : activeContent}
          </main>

          <!-- ===============================================================
               KOLOM 3: RIGHT UTILITY PANEL (DESKTOP XL)
               =============================================================== -->
          <aside class="desktop-right-panel w-[295px] shrink-0 bg-white border-l border-slate-100 p-5 flex-col justify-between gap-5 overflow-y-auto custom-scroll">
            <div class="space-y-5">
              <!-- Kartu Profil Pengguna -->
              <div class="flex flex-col items-center text-center pt-2">
                <div class="relative mb-3">
                  <div class="w-16 h-16 rounded-full bg-[#EEF0FF] text-[#5B45E0] flex items-center justify-center border-4 border-indigo-50">
                    <i data-lucide="bot" class="w-8 h-8"></i>
                  </div>
                  <span class="w-5 h-5 rounded-full bg-blue-500 text-white flex items-center justify-center absolute bottom-0 right-0 border-2 border-white">
                    <i data-lucide="check" class="w-3 h-3"></i>
                  </span>
                </div>
                <h3 class="text-sm font-extrabold text-slate-900">${escapeHtml(userName)}</h3>
                <p class="text-xs text-slate-400 font-medium mt-0.5">${escapeHtml(userSub)}</p>
              </div>

              <!-- Kalender Bulanan Interaktif -->
              ${renderCalendarWidget()}
            </div>

            <!-- Kartu Sesi Live Mentoring (Gradient Ungu + Tombol Gelap) -->
            <div class="live-card-gradient rounded-2xl p-4 text-white shadow-lg shadow-indigo-500/20">
              <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/20 text-[11px] font-bold mb-3">
                <i data-lucide="video" class="w-3.5 h-3.5"></i>
                <span>Sesi Live Mentoring</span>
              </div>
              <h4 class="text-sm font-extrabold leading-snug">
                ${escapeHtml(highlightLive?.judul_sesi || 'Praktik & Bimbingan Belajar SMP')}
              </h4>
              <p class="text-[11px] text-indigo-100 mt-1">
                ${escapeHtml(highlightLive?.pengajar || 'Tim Guru SMP')} • ${escapeHtml(highlightLive?.waktu_wib || 'Setiap Hari, 19.30 WIB')}
              </p>
              <a
                href="${escapeHtml(highlightLive?.link_meeting || '#')}"
                target="_blank"
                rel="noopener noreferrer"
                class="mt-4 w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center justify-center transition"
              >
                Gabung Sesi Live
              </a>
            </div>
          </aside>

          <!-- ===============================================================
               MOBILE FLOATING BOTTOM NAVIGATION BAR (GLASSMORPHISM)
               =============================================================== -->
          <nav class="mobile-bottom-nav fixed bottom-3 left-3 right-3 z-[1000000] glass-nav-mobile rounded-2xl px-2 py-2 items-center justify-around">
            ${navItems.slice(0, 5).map(item => {
              const active = state.activeMenu === item.id;
              return `
                <button
                  onclick="window.lmsActions.setMenu('${item.id}')"
                  class="flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition ${active ? 'bg-[#EEF0FF] text-[#5B45E0]' : 'text-slate-500'}"
                >
                  <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                  <span class="text-[10px] font-bold mt-0.5">${item.label}</span>
                </button>
              `;
            }).join('')}
            ${state.role === 'admin' ? `
              <button
                onclick="window.lmsActions.setMenu('admin_panel')"
                class="flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition ${state.activeMenu === 'admin_panel' ? 'bg-[#EEF0FF] text-[#5B45E0]' : 'text-slate-500'}"
              >
                <i data-lucide="settings" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold mt-0.5">Admin</span>
              </button>
            ` : `
              <button
                onclick="window.lmsActions.setMenu('schedule')"
                class="flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition ${state.activeMenu === 'schedule' ? 'bg-[#EEF0FF] text-[#5B45E0]' : 'text-slate-500'}"
              >
                <i data-lucide="video" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold mt-0.5">Live</span>
              </button>
            `}
          </nav>
        </div>

        ${renderCourseModal()}
        ${renderConfirmModal()}
      `;
    }

    /**
     * =====================================================================
     * 17. MASTER RENDER & EXPOSE GLOBAL EVENT HANDLERS
     * =====================================================================
     */
    function renderApp() {
      const root = document.getElementById('lms-root-app');
      if (!root) return;

      if (!state.isAuthenticated) {
        root.innerHTML = renderLoginView() + renderConfirmModal();
      } else {
        root.innerHTML = renderDashboardShell();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    window.lmsActions = {
      switchLoginTab: (tab) => {
        state.loginTab = tab;
        renderApp();
      },
      submitLogin: handleLoginSubmit,
      quickLogin: quickPreviewLogin,
      logout: handleLogout,
      setMenu: (menu) => {
        state.activeMenu = menu;
        renderApp();
      },
      setAdminTab: (tab) => {
        state.adminSubTab = tab;
        renderApp();
      },
      search: (val) => {
        state.searchQuery = val;
        renderApp();
      },
      setFilterJenjang: (jenjang) => {
        state.filterJenjang = jenjang;
        renderApp();
      },
      changeMonth: changeCalendarMonth,
      selectDay: (day) => {
        state.selectedDay = day;
        renderApp();
      },
      openCourse: openCoursePlayer,
      closeCourse: closeCoursePlayer,
      setCourseTab: (tab) => {
        state.courseModalTab = tab;
        renderApp();
      },
      completeCourse: (courseId) => markCourseCompleted(courseId),
      pickAnswer: (qId, opt) => {
        state.quizAnswers[qId] = opt;
        renderApp();
      },
      submitQuiz: submitCbtQuiz,
      redeem: redeemReward,
      pressCalc: (btn) => {
        if (btn === 'C') {
          state.calcInput = '';
          state.calcResult = '0';
        } else if (btn === '=') {
          try {
            // Evaluasi aman hanya karakter matematika dasar
            const sanitized = state.calcInput.replace(/[^0-9+\-*/.]/g, '');
            if (sanitized) {
              const res = Function('"use strict";return (' + sanitized + ')')();
              state.calcResult = String(Number(res.toFixed(4)));
            }
          } catch {
            state.calcResult = 'Error';
          }
        } else {
          state.calcInput += btn;
        }
        renderApp();
      },
      updateTemp: (val) => {
        state.tempCelsius = val;
        renderApp();
      },
      adminCreateCourse: handleAdminCreateCourse,
      adminCreateSiswa: handleAdminCreateSiswa,
      adminCreateSoal: handleAdminCreateSoal,
      adminCreatePustaka: handleAdminCreatePustaka,
      adminCreateJadwal: handleAdminCreateJadwal,
      adminDelete: handleAdminDeleteRecord,
      closeConfirm: closeConfirmDialog,
      executeConfirm: () => {
        if (state.confirmModal && typeof state.confirmModal.onConfirm === 'function') {
          state.confirmModal.onConfirm();
        }
      },
      toggleMobileUtility: () => {
        showToast(`${state.user?.nama_lengkap} (${state.role === 'admin' ? 'Guru/Admin' : state.user?.kelas})`, 'info');
      }
    };

    // Jalankan inisialisasi pertama saat DOM siap
    checkInitialSession();
  </script>
</body>
</html>
